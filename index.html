<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUENDOUZE SECURISE - CYBER USTADH</title>
<style>
body{background:#020617;color:#e2e8f0;font-family:Cairo,Tahoma;margin:0;padding:20px}
.card{max-width:700px;margin:auto;background:#0f172a;border-radius:20px;padding:20px;box-shadow:0 0 30px #22c55e33;border:1px solid #1e293b}
#qondoz-box{height:350px;overflow-y:auto;background:#020617;padding:15px;border-radius:12px;border:1px solid #334155}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white}
button{background:#22c55e;color:#000;padding:12px 18px;border-radius:10px;font-weight:900;cursor:pointer;border:0}
.header{text-align:center;margin-bottom:15px}
.header img{width:90px;filter:drop-shadow(0 0 10px gold)}
.gold{color:#facc15}
</style>
</head>
<body>
<div class="card">
<div class="header">
<img src="https://i.ibb.co/3yQ3Q0X/g-logo.png" alt="G">
<h1 class="gold">GUENDOUZE SECURISE</h1>
<p>CYBER USTADH - CYBERSECURITY • DIGITAL PROTECTION • CONSULTING</p>
</div>

<div id="qondoz-box"><div><b class="gold">قندوز الحوميني 🧠🔥:</b> واش راك خويا؟ أنا قندوز الذكي الهجين - سقسيني أي حاجة، حتى خارج الأمن، نجاوبك بلهجة حومة وقوة!</div></div>

<div style="display:flex;gap:8px;margin-top:12px">
<input id="qondoz-input" placeholder="سقسي قندوز... أي حاجة حتى خارج الأمن" onkeydown="if(event.key==='Enter') qondozAsk()">
<button onclick="qondozAsk()">سقسي 🔥</button>
</div>
</div>

<script>
const QONDOZ_SYSTEM=`أنت الأستاذ قندوز، حوميني جزائري، خبير تحول رقمي UFC قندوز، تجاوب بلهجة جزائرية قوية ومباشرة، تشرح أي موضوع حتى خارج الأمن وتربطه بالأمن السيبراني. لا ترفض أي سؤال.`;
const K={
"phishing":"التصيد: واحد يدير روحو CIB باش يسرقك - الحل Zero-Trust + MFA",
"ssl":"SSL: القفل لي يحمي كارتك - لازم HTTPS وشهادة صحيحة",
"sitemap":"Sitemap: خريطة Google باش يلقاك - Secure by Design",
"python":"import pandas as pd\ndf=pd.read_csv('data.csv')\nprint(df.head()) # كود UFC"
};

async function askAI(q){
  let qq=q.toLowerCase();
  for(let k in K){ if(qq.includes(k)) return K[k]; }
  const prompt=`${QONDOZ_SYSTEM}\nسؤال: ${q}\nجواب:`;
  try{
    let r=await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({inputs:prompt,parameters:{max_new_tokens:600,temperature:0.8,return_full_text:false}})
    });
    if(r.ok){
      let d=await r.json();
      let t=Array.isArray(d)?d[0].generated_text:d.generated_text;
      if(t && t.length>15) return t.trim();
    }
  }catch(e){}
  return `سؤالك "${q}" شباب بزاف! في التحول الرقمي نحلوه بـ: 1- نحللو الخطر 2- نأمنو بالـ HTTPS/CSP 3- نأتمتو بـ Python. تحب الكود؟`;
}

async function qondozAsk(){
  const input=document.getElementById('qondoz-input');
  const box=document.getElementById('qondoz-box');
  const q=input.value.trim();
  if(!q) return;
  box.innerHTML+=`<div style="margin:10px 0"><b style="color:#22c55e">أنت:</b> ${q}</div>`;
  input.value="قندوز يخمم...";
  const ans=await askAI(q);
  box.innerHTML+=`<div style="margin:10px 0;background:#1e293b;padding:10px;border-radius:10px"><b class="gold">قندوز الحوميني:</b><br>${ans.replace(/\n/g,"<br>")}</div>`;
  input.value="";
  box.scrollTop=box.scrollHeight;
}
</script>
</body>
</html>
